<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>Game Play 01 - Bintang Ceria Adventure</title><style>@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap');:root{--sky:#8ee7ff;--sky2:#e8fbff;--navy:#17324d;--yellow:#ffd93d;--pink:#ff7ac8;--mint:#98f35f;--blue:#3abef9;--shadow:0 14px 35px rgba(23,50,77,.18)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Fredoka,Nunito,system-ui,sans-serif;background:linear-gradient(180deg,var(--sky2),var(--sky));color:var(--navy);touch-action:manipulation}.game-shell{position:relative;width:100vw;height:100vh;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.75),transparent 18%),radial-gradient(circle at 82% 10%,rgba(255,217,61,.45),transparent 15%),linear-gradient(180deg,#dffaff 0%,#93eaff 55%,#78d977 100%)}.cloud{position:absolute;width:150px;height:55px;background:#fff;border-radius:999px;opacity:.9;filter:drop-shadow(0 8px 8px rgba(0,0,0,.05));animation:floatCloud 18s linear infinite;z-index:1}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:70px;height:70px;left:25px;top:-30px}.cloud:after{width:55px;height:55px;right:26px;top:-18px}.c1{left:-170px;top:86px;animation-duration:20s}.c2{left:-220px;top:180px;transform:scale(.75);animation-delay:7s;animation-duration:25s}.c3{left:-240px;top:42px;transform:scale(.6);animation-delay:12s;animation-duration:28s}@keyframes floatCloud{from{translate:0 0}to{translate:calc(100vw + 280px) 0}}.grass{position:absolute;left:0;right:0;bottom:0;height:95px;background:linear-gradient(180deg,#6bd765,#42b548);z-index:2}.rainbow{position:absolute;left:50%;bottom:65px;width:300px;height:150px;translate:-50% 0;border-radius:300px 300px 0 0;background:conic-gradient(from 180deg at 50% 100%,#ff7ac8,#ffd93d,#98f35f,#3abef9,#b99cff,transparent 65%);opacity:.72;z-index:1}.top-bar{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20}.pill{display:flex;align-items:center;gap:8px;min-height:54px;padding:10px 14px;border:4px solid rgba(23,50,77,.11);border-radius:24px;background:rgba(255,255,255,.86);box-shadow:var(--shadow);font-weight:800}.score-pill{min-width:94px;justify-content:center;font-size:21px}.timer-pill{min-width:92px;justify-content:center;font-size:20px}.timer-pill.warning{animation:timerPulse .55s infinite alternate;background:#fff5b8;border-color:#ffbd30}@keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.06)}}.level-pill{flex:1;justify-content:center;text-align:center;font-size:16px;max-width:230px}.icon-btn{width:56px;height:56px;border:0;border-radius:20px;box-shadow:var(--shadow);background:#fff;font-size:25px}.instruction-card{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:16px;right:16px;z-index:19;min-height:70px;border-radius:28px;padding:12px 16px;background:linear-gradient(135deg,#fff,#fff7ca);border:4px solid rgba(255,217,61,.65);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900}.game-area{position:absolute;inset:0;z-index:10}.fall-item{position:absolute;width:82px;height:82px;border:0;background:transparent;cursor:pointer;font-size:68px;line-height:1;filter:drop-shadow(0 10px 10px rgba(0,0,0,.14));animation:fall linear forwards,wiggle 1s ease-in-out infinite}@keyframes fall{from{top:-90px}to{top:calc(100vh + 95px)}}@keyframes wiggle{0%,100%{rotate:-5deg}50%{rotate:5deg}}.fall-label{position:absolute;left:50%;top:50%;translate:-50% -46%;font-size:28px;font-weight:900;color:#17324d;text-shadow:0 2px 0 rgba(255,255,255,.9);pointer-events:none}.pop{position:absolute;width:88px;height:88px;border-radius:50%;pointer-events:none;z-index:30;animation:popBurst .55s ease-out forwards;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff}@keyframes popBurst{0%{transform:scale(.4);opacity:0;background:rgba(255,217,61,.95)}45%{transform:scale(1.25);opacity:1;background:rgba(255,122,200,.9)}100%{transform:scale(1.75);opacity:0;background:rgba(152,243,95,0)}}.confetti{position:absolute;width:11px;height:16px;border-radius:4px;pointer-events:none;z-index:31;animation:confettiFly .7s ease-out forwards}@keyframes confettiFly{to{transform:translate(var(--x),var(--y)) rotate(420deg);opacity:0}}.bottom-dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:22;display:flex;gap:10px;align-items:center;justify-content:center}.big-btn{border:0;border-radius:24px;padding:14px 18px;min-height:58px;background:linear-gradient(135deg,var(--yellow),#ffb72e);color:#17324d;font-size:18px;font-weight:900;box-shadow:0 12px 0 #d99212,var(--shadow)}.small-btn{border:0;border-radius:20px;padding:12px 14px;min-height:52px;background:#fff;color:#17324d;font-size:16px;font-weight:900;box-shadow:var(--shadow)}.overlay{position:absolute;inset:0;z-index:80;background:rgba(31,66,93,.25);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:min(430px,94vw);border-radius:36px;background:linear-gradient(180deg,#fff,#fff7d9);border:6px solid #fff;box-shadow:0 30px 70px rgba(0,0,0,.2);padding:24px 18px;text-align:center}.modal h1{margin:4px 0 8px;font-size:34px}.modal p{margin:8px auto 16px;font-size:19px;font-weight:800;max-width:320px}.star-row{display:flex;justify-content:center;gap:8px;font-size:48px;margin:10px 0 14px}.level-map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 18px}.level-node{height:48px;border-radius:16px;display:grid;place-items:center;background:#eaf7ff;border:3px solid rgba(58,190,249,.3);font-size:20px;font-weight:900}.level-node.active{background:linear-gradient(135deg,#ffd93d,#ff7ac8);color:#fff;transform:scale(1.06)}.level-node.done{background:linear-gradient(135deg,#98f35f,#3abef9);color:#fff}</style></head><body><main class="game-shell"><div class="rainbow"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="grass"></div><section class="top-bar"><div class="pill score-pill">⭐ <span id="scoreText">0</span></div><div class="pill level-pill" id="levelTitle">Loading...</div><div class="pill timer-pill" id="timerPill">⏰ <span id="timeText">60</span></div><button class="icon-btn" id="soundBtn">🔊</button></section><section class="instruction-card" id="instructionText">Sedia...</section><section class="game-area" id="gameArea"></section><section class="bottom-dock"><button class="small-btn" id="pauseBtn">⏸️ Pause</button><button class="big-btn" id="startBtn">▶️ Mula Main</button></section><section class="overlay show" id="startOverlay"><div class="modal"><h1>🌟 Bintang Ceria!</h1><p>Game ini membaca bank soalan dan audio dari JSON / Admin Panel.</p><div class="level-map" id="startLevelMap"></div><button class="big-btn" id="playNowBtn">▶️ Mula Game 1</button></div></section><section class="overlay" id="rewardOverlay"><div class="modal"><h1 id="rewardTitle">Syabas!</h1><div class="star-row" id="rewardStars">⭐⭐⭐</div><p id="rewardText">Hebat!</p><div class="level-map" id="rewardLevelMap"></div><button class="big-btn" id="nextBtn">➡️ Seterusnya</button></div></section></main><script>
const BANK='data/question-bank.json';let bank,games=[],currentGame=0,score=0,totalScore=0,timeLeft=60,running=false,paused=false,spawnTimer,countdownTimer,audioCtx,soundOn=true,musicAudio,voiceAudio,fallbackMusicTimer;const $=id=>document.getElementById(id),gameArea=$('gameArea'),scoreText=$('scoreText'),timeText=$('timeText'),timerPill=$('timerPill'),levelTitle=$('levelTitle'),instructionText=$('instructionText'),soundBtn=$('soundBtn'),startBtn=$('startBtn'),playNowBtn=$('playNowBtn'),pauseBtn=$('pauseBtn'),rewardOverlay=$('rewardOverlay'),startOverlay=$('startOverlay'),nextBtn=$('nextBtn'),rewardTitle=$('rewardTitle'),rewardText=$('rewardText'),rewardStars=$('rewardStars'),rewardLevelMap=$('rewardLevelMap'),startLevelMap=$('startLevelMap');
async function loadBank(){const r=await fetch(BANK,{cache:'no-store'});bank=await r.json();games=bank.games||[];levelTitle.textContent=games[0].title;instructionText.textContent=games[0].instructionText;timeText.textContent=games[0].durationSeconds;buildMap(startLevelMap)}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function ap(type,file){if(type==='voice')return bank.audio.voicePath+file;if(type==='sfx')return bank.audio.sfxPath+file;if(type==='music')return bank.audio.musicPath+file;return file}function playFile(type,file,opt={}){if(!soundOn||!file)return null;let a=new Audio(ap(type,file));a.volume=opt.volume??.8;a.loop=!!opt.loop;a.play().catch(()=>{});return a}function voice(file){if(!bank.settings.enableVoiceInstruction)return;if(voiceAudio)voiceAudio.pause();voiceAudio=playFile('voice',file,{volume:.9})}function tone(f=600,d=.13,t='sine',g=.12){if(!soundOn)return;initAudio();const o=audioCtx.createOscillator(),gn=audioCtx.createGain();o.type=t;o.frequency.value=f;gn.gain.setValueAtTime(g,audioCtx.currentTime);gn.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(gn);gn.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function sfx(k){const file=bank.audio.sfx[k];const a=playFile('sfx',file,{volume:.8});return !!a}function correct(){if(!sfx('correct'))tone(880,.12,'triangle',.12)}function wrong(){if(!sfx('wrong'))tone(220,.15,'sine',.1)}function rewardS(){if(!sfx('reward'))tone(700,.2,'triangle',.12)}function tick(){if(!sfx('tick'))tone(950,.045,'square',.045)}function startMusic(){stopMusic();musicAudio=playFile('music',bank.audio.backgroundMusic,{volume:.2,loop:true});setTimeout(()=>{if(!musicAudio||musicAudio.paused)fallbackMusic()},600)}function fallbackMusic(){clearInterval(fallbackMusicTimer);let notes=[523,659,784,659,587,698,880,698],i=0;fallbackMusicTimer=setInterval(()=>{if(running&&!paused&&soundOn)tone(notes[i++%notes.length],.25,'triangle',.035)},420)}function stopMusic(){if(musicAudio){musicAudio.pause();musicAudio=null}clearInterval(fallbackMusicTimer)}
function buildMap(el){el.innerHTML='';games.forEach((g,i)=>{let n=document.createElement('div');n.className='level-node';if(i<currentGame)n.classList.add('done');if(i===currentGame)n.classList.add('active');n.textContent=i<currentGame?'✅':i+1;el.appendChild(n)})}const rnd=(a,b)=>Math.random()*(b-a)+a;function itemData(g){return g.items[Math.floor(Math.random()*g.items.length)]}function spawn(){if(!running||paused)return;let g=games[currentGame],d=itemData(g),b=document.createElement('button');b.className='fall-item';b.innerHTML=(d.icon||'⭐')+(d.label?`<span class="fall-label">${d.label}</span>`:'');b.style.left=rnd(6,82)+'vw';b.style.animationDuration=rnd(4.6,7.2)+'s';b.addEventListener('pointerdown',e=>{e.preventDefault();let r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;if(d.isCorrect){score++;totalScore++;scoreText.textContent=score;correct();pop(x,y,'+1');confetti(x,y);b.remove()}else{wrong();pop(x,y,'😅')}},{passive:false});gameArea.appendChild(b);setTimeout(()=>b.remove(),7600)}function pop(x,y,t){let p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=x-44+'px';p.style.top=y-44+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),650)}function confetti(x,y){let cs=['#ffd93d','#ff7ac8','#98f35f','#3abef9','#b99cff'];for(let i=0;i<12;i++){let c=document.createElement('div');c.className='confetti';c.style.left=x+'px';c.style.top=y+'px';c.style.background=cs[i%cs.length];c.style.setProperty('--x',rnd(-95,95)+'px');c.style.setProperty('--y',rnd(-95,55)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),800)}}
function startGame(){initAudio();startOverlay.classList.remove('show');rewardOverlay.classList.remove('show');clearGame();let g=games[currentGame];score=0;timeLeft=g.durationSeconds||60;running=true;paused=false;scoreText.textContent=0;timeText.textContent=timeLeft;levelTitle.textContent=g.title;instructionText.textContent=g.instructionText;startMusic();voice(bank.audio.voice.welcome);setTimeout(()=>voice(g.instructionAudio),1500);spawnTimer=setInterval(spawn,currentGame>=7?780:950);countdownTimer=setInterval(()=>{if(!running||paused)return;timeLeft--;timeText.textContent=timeLeft;if(timeLeft===10)voice(bank.audio.voice.almostFinish);if(timeLeft<=10){timerPill.classList.add('warning');tick()}if(timeLeft<=0)endGame()},1000)}function clearGame(){gameArea.innerHTML='';clearInterval(spawnTimer);clearInterval(countdownTimer);timerPill.classList.remove('warning')}function endGame(){running=false;clearGame();stopMusic();rewardS();voice(bank.audio.voice.rewardGood);let g=games[currentGame],r=g.reward,stars=score>=r.threeStarsScore?3:score>=r.twoStarsScore?2:score>=r.passScore?1:0;rewardStars.textContent=stars===3?'⭐⭐⭐':stars===2?'⭐⭐☆':stars===1?'⭐☆☆':'🌟';rewardTitle.textContent=currentGame===games.length-1?'👑 Tamat Semua!':'🎉 Syabas!';rewardText.textContent=currentGame===games.length-1?`Hebat! Jumlah bintang awak: ${totalScore} ⭐`:`Awak dapat ${score} bintang. Jom sambung game seterusnya!`;buildMap(rewardLevelMap);nextBtn.textContent=currentGame===games.length-1?'🔁 Main Semula':'➡️ Game Seterusnya';rewardOverlay.classList.add('show')}function nextGame(){if(currentGame>=games.length-1){currentGame=0;totalScore=0}else currentGame++;startGame()}soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';if(!soundOn)stopMusic();else if(running)startMusic()};pauseBtn.onclick=()=>{if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶️ Sambung':'⏸️ Pause'};startBtn.onclick=startGame;playNowBtn.onclick=startGame;nextBtn.onclick=nextGame;loadBank().catch(()=>alert('Gagal load bank soalan.'));
</script></body></html>
