<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kids Adventure World</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6ddcff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kids Adventure">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <style>
    :root{
      --navy:#17324d;--sky:#6ddcff;--sky2:#e9fbff;--yellow:#ffd93d;--pink:#ff7ac8;--mint:#a7e92f;--blue:#3abef9;--purple:#9b7cff;--orange:#ff9f43;--red:#ff4d6d;--white:#fff;
      --shadow:0 18px 38px rgba(23,50,77,.20);--soft:0 10px 24px rgba(23,50,77,.14);--glass:rgba(255,255,255,.78)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Nunito,Arial,system-ui,sans-serif;background:#9eeaff;color:var(--navy);touch-action:none}
    button{font:inherit;color:inherit;cursor:pointer;border:0}
    .app{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;background:linear-gradient(180deg,#dffbff 0%,#7ee2ff 52%,#7cd862 100%)}
    .sky-glow{position:absolute;inset:-20%;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.9),transparent 20%),radial-gradient(circle at 85% 8%,rgba(255,217,61,.65),transparent 15%),radial-gradient(circle at 55% 35%,rgba(255,122,200,.25),transparent 25%);z-index:0;pointer-events:none}
    .cloud{position:absolute;width:150px;height:54px;background:white;border-radius:100px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.05));opacity:.92;z-index:1;animation:cloudMove linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}.cloud:before{width:68px;height:68px;left:24px;top:-30px}.cloud:after{width:54px;height:54px;right:26px;top:-18px}.c1{top:72px;left:-180px;animation-duration:28s}.c2{top:160px;left:-220px;transform:scale(.78);animation-duration:35s;animation-delay:7s}.c3{top:34px;left:-210px;transform:scale(.6);animation-duration:40s;animation-delay:15s}@keyframes cloudMove{to{translate:calc(100vw + 300px) 0}}
    .bird{position:absolute;top:115px;left:-60px;font-size:28px;z-index:2;animation:birdFly 18s linear infinite}.bird.b2{top:210px;animation-delay:8s;font-size:22px;animation-duration:23s}@keyframes birdFly{to{translate:calc(100vw + 120px) -35px}}
    .ground{position:absolute;left:0;right:0;bottom:0;height:108px;background:radial-gradient(circle at 9% 100%,#4abd51 0 48px,transparent 49px),radial-gradient(circle at 30% 100%,#64d865 0 58px,transparent 59px),radial-gradient(circle at 55% 100%,#47b84f 0 52px,transparent 53px),radial-gradient(circle at 84% 100%,#60cf61 0 58px,transparent 59px),linear-gradient(180deg,#72df66,#3db44a);z-index:1}.tree{position:absolute;bottom:54px;font-size:56px;z-index:2;animation:sway 2.4s ease-in-out infinite alternate;transform-origin:bottom center}.tree.t1{left:12px}.tree.t2{right:20px;animation-delay:.7s}.tree.t3{left:48%;font-size:46px;opacity:.65;animation-delay:1s}@keyframes sway{to{rotate:3deg}}
    .screen{position:absolute;inset:0;z-index:10;display:none}.screen.active{display:block}.safe{position:absolute;inset:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px) 12px;display:flex;flex-direction:column;gap:12px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:20}.brand{display:flex;align-items:center;gap:10px;min-height:56px;background:var(--glass);backdrop-filter:blur(12px);border:3px solid rgba(255,255,255,.65);border-radius:24px;padding:8px 13px;box-shadow:var(--soft);font-weight:1000}.brand .logo{font-size:30px}.brand small{display:block;font-size:11px;opacity:.72;margin-top:-3px}.hud{display:flex;gap:8px}.hud-pill,.nav-btn{min-height:48px;padding:9px 12px;border-radius:18px;background:rgba(255,255,255,.9);box-shadow:var(--soft);font-weight:1000;border:3px solid rgba(255,255,255,.55)}.nav-btn{font-size:14px}.nav-btn:active,.world-card:active,.game-card:active,.tool:active,.drive-btn:active{transform:scale(.96)}
    .home-content{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:0}.hero{text-align:center;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.55));border:3px solid rgba(255,255,255,.7);border-radius:30px;padding:13px 14px;box-shadow:var(--shadow)}.hero h1{margin:0;font-size:clamp(24px,6vw,42px);line-height:1}.hero p{margin:5px 0 0;font-weight:900;opacity:.78;font-size:13px}.world-grid{min-height:0;overflow:auto;padding:3px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;scrollbar-width:none}.world-grid::-webkit-scrollbar{display:none}.world-card{position:relative;min-height:132px;border-radius:30px;padding:14px;box-shadow:var(--shadow);overflow:hidden;border:4px solid rgba(255,255,255,.7);display:flex;flex-direction:column;justify-content:space-between;text-align:left}.world-card:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 35%);opacity:.55;animation:shine 4s ease-in-out infinite}.world-card h2{position:relative;margin:0;font-size:20px;line-height:1}.world-card p{position:relative;margin:4px 0 0;font-weight:900;font-size:12px;opacity:.84}.world-icon{position:absolute;right:10px;bottom:4px;font-size:54px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.13));animation:bob 1.8s ease-in-out infinite alternate}.badge{position:relative;align-self:flex-start;margin-top:8px;background:rgba(255,255,255,.82);padding:7px 10px;border-radius:999px;font-weight:1000;font-size:12px}.fun{background:linear-gradient(135deg,#ffcf6c,#ff7ac8)}.write{background:linear-gradient(135deg,#9b7cff,#4bd8ff)}.studio{background:linear-gradient(135deg,#ffd93d,#ff9f43)}.race{background:linear-gradient(135deg,#64e6ff,#52d365)}.pet{background:linear-gradient(135deg,#a7e92f,#fff176)}.space{background:linear-gradient(135deg,#7b61ff,#33d9ff)}@keyframes shine{50%{translate:18% 12%;opacity:.85}}@keyframes bob{to{translate:0 -8px;rotate:4deg}}
    .footer-note{text-align:center;font-size:12px;font-weight:900;background:rgba(255,255,255,.55);padding:8px;border-radius:18px}
    .category{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:3px solid rgba(255,255,255,.7);border-radius:26px;box-shadow:var(--shadow);padding:12px;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}.category-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.category-title h1{font-size:24px;margin:0}.category-title p{font-size:12px;margin:2px 0 0;font-weight:900;opacity:.75}.game-grid{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:2px;scrollbar-width:none}.game-grid::-webkit-scrollbar{display:none}.game-card{min-height:105px;border-radius:24px;border:3px solid rgba(255,255,255,.75);box-shadow:var(--soft);padding:12px;text-align:left;background:linear-gradient(135deg,#fff,#e8fbff);position:relative;overflow:hidden}.game-card span{font-size:34px;display:block}.game-card b{display:block;font-size:15px;margin-top:4px}.game-card small{display:block;font-weight:900;opacity:.66;margin-top:3px}.game-card:after{content:"";position:absolute;right:-18px;bottom:-20px;width:72px;height:72px;background:rgba(255,217,61,.28);border-radius:50%}
    .play-area{flex:1;min-height:0;background:rgba(255,255,255,.68);border:3px solid rgba(255,255,255,.75);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;position:relative}.game-top{display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:40}.game-title{flex:1;text-align:center;font-weight:1000;background:rgba(255,255,255,.88);border-radius:20px;padding:10px;box-shadow:var(--soft)}
    .tap-stage{position:absolute;inset:0;background:linear-gradient(180deg,#e9fbff,#b9f3ff 55%,#89de6a);overflow:hidden}.target{position:absolute;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#fff,#ffd93d);box-shadow:var(--shadow);border:4px solid #fff;animation:targetBob 1s ease-in-out infinite alternate}.target.pop{animation:pop .25s ease forwards}@keyframes targetBob{to{translate:0 -9px}}@keyframes pop{to{scale:1.45;opacity:0;rotate:25deg}}
    .mini-caption{position:absolute;left:16px;right:16px;bottom:16px;text-align:center;background:rgba(255,255,255,.85);border-radius:22px;padding:12px;font-weight:1000;box-shadow:var(--soft)}
    .canvas-wrap{position:absolute;inset:0;background:linear-gradient(135deg,#fff9f0,#e9fbff);overflow:hidden}.draw-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.draw-toolbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;z-index:20;background:rgba(255,255,255,.82);border:3px solid rgba(255,255,255,.7);border-radius:24px;padding:8px;box-shadow:var(--soft)}.tool{width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:0 6px 12px rgba(0,0,0,.08);font-size:20px;font-weight:1000}.tool.active{outline:4px solid #ffd93d}.color-dot{width:34px;height:34px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 12px rgba(0,0,0,.15)}.draw-guide{position:absolute;left:50%;top:45%;translate:-50% -50%;font-size:min(42vw,230px);font-weight:1000;opacity:.10;pointer-events:none;color:#17324d;line-height:1}.no-limit{position:absolute;top:12px;left:12px;right:12px;text-align:center;font-weight:1000;background:rgba(255,255,255,.78);border-radius:20px;padding:9px;z-index:12}
    .race-stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#88e9ff 0 35%,#6bd76a 36% 100%)}.mountain{position:absolute;left:-10%;right:-10%;top:24%;height:90px;background:linear-gradient(135deg,transparent 0 20%,#74b7d1 21% 45%,transparent 46%),linear-gradient(45deg,transparent 0 28%,#5ca7c9 29% 51%,transparent 52%);opacity:.75}.road{position:absolute;left:50%;bottom:-20%;width:min(78vw,430px);height:105%;translate:-50% 0;background:linear-gradient(90deg,#3b4652,#687584 12%,#556271 50%,#687584 88%,#3b4652);clip-path:polygon(33% 0,67% 0,100% 100%,0 100%);box-shadow:inset 0 0 35px rgba(0,0,0,.25)}.road-line{position:absolute;left:50%;top:-80px;width:14px;height:90px;background:#ffd93d;border-radius:9px;translate:-50% 0;box-shadow:0 150px 0 #ffd93d,0 300px 0 #ffd93d,0 450px 0 #ffd93d,0 600px 0 #ffd93d;animation:roadMove .75s linear infinite}@keyframes roadMove{to{translate:-50% 150px}}.car{position:absolute;left:50%;bottom:92px;width:74px;height:112px;translate:-50% 0;border-radius:28px 28px 16px 16px;background:linear-gradient(180deg,#ff4d6d,#b91838);box-shadow:0 16px 18px rgba(0,0,0,.25);z-index:15}.car:before{content:"";position:absolute;left:13px;right:13px;top:12px;height:28px;background:#aaf3ff;border-radius:18px 18px 8px 8px}.car:after{content:"";position:absolute;left:11px;right:11px;bottom:14px;height:20px;background:#ffd93d;border-radius:8px}.wheel{position:absolute;width:18px;height:28px;background:#172435;border-radius:9px;bottom:14px}.w1{left:-8px}.w2{right:-8px}.obstacle{position:absolute;top:-80px;width:64px;height:64px;display:grid;place-items:center;font-size:44px;z-index:14;filter:drop-shadow(0 10px 8px rgba(0,0,0,.2))}.coin{position:absolute;top:-55px;width:45px;height:45px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#ffd93d;border:4px solid #fff;z-index:13;box-shadow:var(--soft)}.crash{animation:shake .25s ease 3}.spark{position:absolute;left:50%;top:58%;translate:-50% -50%;font-size:64px;z-index:30;pointer-events:none;animation:spark .5s ease forwards}.smoke{position:absolute;left:50%;top:63%;translate:-50% -50%;font-size:54px;z-index:29;pointer-events:none;animation:smoke .8s ease forwards}@keyframes shake{25%{translate:-8px 0}50%{translate:8px 0}75%{translate:-5px 0}}@keyframes spark{to{scale:1.8;opacity:0;rotate:25deg}}@keyframes smoke{to{translate:-50% -90%;opacity:0;scale:1.6}}
    .drive-btn{position:absolute;width:74px;height:74px;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 15px 28px rgba(23,50,77,.25);border:4px solid rgba(255,255,255,.75);font-size:36px;font-weight:1000;z-index:50;touch-action:none}.drive-btn.editing{outline:4px dashed #ffd93d}.drive-panel{position:absolute;right:10px;top:74px;background:rgba(255,255,255,.88);border-radius:20px;padding:8px;box-shadow:var(--soft);z-index:55;display:none;gap:6px;flex-direction:column;width:178px}.drive-panel.show{display:flex}.drive-panel label{font-size:11px;font-weight:1000}.drive-panel input{width:100%}.drive-panel button{padding:7px 8px;border-radius:12px;background:#ffd93d;font-weight:1000}.race-hint{position:absolute;left:10px;top:80px;background:rgba(255,255,255,.85);border-radius:18px;padding:8px 10px;font-size:12px;font-weight:1000;z-index:20}
    .modal{position:absolute;inset:0;background:rgba(23,50,77,.35);backdrop-filter:blur(6px);display:none;place-items:center;z-index:100}.modal.show{display:grid}.box{width:min(92vw,420px);background:#fff;border-radius:30px;padding:20px;text-align:center;box-shadow:var(--shadow);border:4px solid rgba(255,255,255,.8)}.box h2{margin:0 0 8px}.box p{font-weight:900}.big-btn{padding:13px 18px;border-radius:18px;background:linear-gradient(135deg,#ffd93d,#ff9f43);font-weight:1000;box-shadow:var(--soft);margin:4px}
    @media (max-width:390px){.world-grid,.game-grid{gap:8px}.world-card{min-height:118px;padding:12px;border-radius:24px}.world-card h2{font-size:17px}.world-icon{font-size:46px}.hud-pill{font-size:13px;padding:8px}.nav-btn{padding:8px;font-size:12px}.drive-btn{width:68px;height:68px}}
    @media (orientation:landscape) and (max-height:520px){.hero{display:none}.world-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.world-card{min-height:112px}.safe{gap:8px}.category-title h1{font-size:20px}.game-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.game-card{min-height:82px}.game-card span{font-size:28px}.draw-toolbar{bottom:6px}.car{bottom:62px}}
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="sky-glow"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="bird">🐦</div><div class="bird b2">🦋</div><div class="ground"></div><div class="tree t1">🌴</div><div class="tree t2">🌳</div><div class="tree t3">🌲</div>

  <section class="screen active" id="homeScreen"><div class="safe home-content">
    <div class="top"><div class="brand"><span class="logo">🌍</span><div>KIDS ADVENTURE<br><small>Premium Play & Learn World</small></div></div><div class="hud"><div class="hud-pill">⭐ <span id="xp">0</span></div><div class="hud-pill">🪙 <span id="coins">0</span></div></div></div>
    <div class="hero"><h1>Dunia Permainan Ceria</h1><p>Pilih dunia. Main, tulis, lukis dan berlumba dengan animasi premium.</p></div>
    <div class="world-grid" id="worldGrid"></div>
    <div class="footer-note">PWA Offline Ready • Back/Menu/Restart • Mesra Telefon & Tablet</div>
  </div></section>

  <section class="screen" id="categoryScreen"><div class="safe">
    <div class="top game-top"><button class="nav-btn" onclick="showHome()">🏠 Menu</button><div class="game-title" id="categoryHeader">World</div><button class="nav-btn" onclick="openSettings()">⚙️ Setting</button></div>
    <div class="category"><div class="category-title"><div><h1 id="categoryTitle">World</h1><p id="categoryDesc">Pilih game</p></div><div class="hud-pill">10 Game</div></div><div class="game-grid" id="gameGrid"></div></div>
  </div></section>

  <section class="screen" id="playScreen"><div class="safe">
    <div class="top game-top"><button class="nav-btn" onclick="backToCategory()">⬅ Back</button><div class="game-title" id="playTitle">Game</div><button class="nav-btn" onclick="restartGame()">🔄 Restart</button><button class="nav-btn" onclick="showHome()">🏠</button></div>
    <div class="play-area" id="playArea"></div>
  </div></section>

  <div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Hebat!</h2><p id="modalText">Teruskan bermain.</p><button class="big-btn" onclick="closeModal()">OK</button><button class="big-btn" onclick="backToCategory()">Pilih Game</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let state={world:null,game:null,xp:+localStorage.kaw_xp||0,coins:+localStorage.kaw_coins||0,score:0,targets:0,drawColor:'#ff4d6d',drawSize:8,tool:'pen',race:null,drawCtx:null,drawCanvas:null};
$('xp').textContent=state.xp;$('coins').textContent=state.coins;
const worlds=[
 {id:'fun',name:'🎈 Fun Land',old:'A',desc:'10 game ceria & cepat',cls:'fun',icon:'🎈',games:['Balloon Pop','Fruit Smash','Memory Match','Animal Match','Color Catch','Shape Hunter','Monster Jump','Candy Run','Bubble Burst','Happy Quiz']},
 {id:'write',name:'✨ Magic Writing',old:'B',desc:'10 aktiviti tulis ajaib',cls:'write',icon:'✨',games:['Trace Number','Trace ABC','Trace Jawi','Trace Shape','Connect Dot','Rainbow Writing','Magic Pen','Glow Writing','Star Writing','Letter Adventure']},
 {id:'studio',name:'🎨 Creative Studio',old:'C',desc:'Lukis bebas tanpa had',cls:'studio',icon:'🎨',games:['Free Draw','Coloring Pad','Crayon Art','Sticker Canvas','Draw House','Draw Car','Draw Cat','Draw Tree','Rainbow Paint','My Artwork']},
 {id:'race',name:'🏎️ Racing Island',old:'D',desc:'Kereta kiri kanan real',cls:'race',icon:'🏎️',games:['Beach Road','Forest Road','City Road','Mountain Road','Rainbow Road','Stone Dodge','Barrier Rush','Coin Highway','Speed Kid','Junior Racer']},
 {id:'pet',name:'🐣 Pet World',old:'E',desc:'Feed pet & collect coin',cls:'pet',icon:'🐣',games:['Feed Chick','Rabbit Care','Cat Treat','Dog Snack','Bird Song','Egg Hatch','Pet Bath','Pet Sleep','Pet Coin','Pet Level Up']},
 {id:'space',name:'🚀 Space Explorer',old:'F',desc:'Roket & bintang',cls:'space',icon:'🚀',games:['Star Catch','Asteroid Dodge','Rocket Boost','Galaxy Coin','Moon Jump','Planet Match','Space Quiz','Comet Run','Alien Friend','Rocket Dock']}
];
function renderWorlds(){ $('worldGrid').innerHTML=worlds.map(w=>`<button class="world-card ${w.cls}" onclick="openWorld('${w.id}')"><div><h2>${w.name}</h2><p>${w.desc}</p></div><div class="badge">${w.old} • ${w.games.length} aktiviti</div><div class="world-icon">${w.icon}</div></button>`).join(''); }
renderWorlds();
function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function showHome(){stopRace();screen('homeScreen')}
function openWorld(id){state.world=worlds.find(w=>w.id===id);$('categoryHeader').textContent=state.world.name;$('categoryTitle').textContent=state.world.name;$('categoryDesc').textContent=state.world.desc;$('gameGrid').innerHTML=state.world.games.map((g,i)=>`<button class="game-card" onclick="startGame(${i})"><span>${state.world.icon}</span><b>${i+1}. ${g}</b><small>${state.world.old} World • Tap untuk mula</small></button>`).join('');screen('categoryScreen')}
function backToCategory(){stopRace(); if(state.world){openWorld(state.world.id)}else showHome()}
function startGame(i){state.game=i;screen('playScreen');restartGame()}
function restartGame(){stopRace();$('playTitle').textContent=(state.world?state.world.name:'Game')+' • '+(state.world?.games[state.game]||''); if(state.world.id==='race') return makeRace(); if(state.world.id==='studio'||state.world.id==='write') return makeDraw(state.world.id); makeTapGame();}
function addReward(x=5,c=2){state.xp+=x;state.coins+=c;localStorage.kaw_xp=state.xp;localStorage.kaw_coins=state.coins;$('xp').textContent=state.xp;$('coins').textContent=state.coins}
function showModal(t,m){$('modalTitle').textContent=t;$('modalText').textContent=m;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function makeTapGame(){const area=$('playArea');state.score=0;state.targets=0;area.innerHTML=`<div class="tap-stage" id="tapStage"><div class="mini-caption">Tap objek yang muncul. Dapatkan 10 coin untuk menang! ⭐</div></div>`;for(let k=0;k<5;k++) setTimeout(spawnTarget,k*550)}
function spawnTarget(){const st=$('tapStage'); if(!st) return; const el=document.createElement('button'); el.className='target'; const icons=['🎈','🍎','⭐','🍬','🐱','🫧','🦋','🚀']; el.textContent=icons[Math.floor(Math.random()*icons.length)]; el.style.left=(8+Math.random()*72)+'%'; el.style.top=(14+Math.random()*54)+'%'; el.onclick=()=>{el.classList.add('pop');addReward(2,1);state.targets++;setTimeout(()=>el.remove(),220); if(state.targets<12) setTimeout(spawnTarget,250); else showModal('🎉 Hebat!','Game siap. XP dan coin sudah ditambah.')}; st.appendChild(el)}
function makeDraw(type){const area=$('playArea');const guides= type==='write' ? ['123','ABC','ا ب ت','★','✦'][state.game%5] : '';area.innerHTML=`<div class="canvas-wrap"><div class="no-limit">${type==='studio'?'🎨 Creative Studio: Lukis sampai puas. Tiada had masa, tiada markah.':'✨ Magic Writing: Ikut atau bebas tulis dengan magic pen.'}</div><div class="draw-guide">${guides}</div><canvas class="draw-canvas" id="drawCanvas"></canvas><div class="draw-toolbar"><button class="tool active" data-tool="pen">✏️</button><button class="tool" data-tool="rainbow">🌈</button><button class="tool" data-tool="glow">✨</button><button class="tool" data-tool="eraser">🧽</button><button class="color-dot" style="background:#ff4d6d" data-color="#ff4d6d"></button><button class="color-dot" style="background:#3abef9" data-color="#3abef9"></button><button class="color-dot" style="background:#a7e92f" data-color="#a7e92f"></button><button class="color-dot" style="background:#ffd93d" data-color="#ffd93d"></button><button class="tool" onclick="clearDraw()">🗑️</button><button class="tool" onclick="saveDrawing()">💾</button></div></div>`;initCanvas()}
function initCanvas(){const c=$('drawCanvas'),ctx=c.getContext('2d');state.drawCanvas=c;state.drawCtx=ctx;function resize(){const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineJoin='round'}resize();window.addEventListener('resize',resize,{once:true});let drawing=false,last=null;function pos(e){const t=e.touches?e.touches[0]:e;const r=c.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}function down(e){drawing=true;last=pos(e);drawDot(last);e.preventDefault()}function move(e){if(!drawing)return;const p=pos(e);drawLine(last,p);last=p;e.preventDefault()}function up(){drawing=false;addReward(1,0)}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.drawColor=b.dataset.color});}
function strokeStyle(){if(state.tool==='rainbow') return `hsl(${Date.now()/8%360},95%,55%)`; if(state.tool==='glow') return state.drawColor; if(state.tool==='eraser') return '#fff9f0'; return state.drawColor}
function drawLine(a,b){const ctx=state.drawCtx;ctx.globalCompositeOperation=state.tool==='eraser'?'destination-out':'source-over';ctx.shadowBlur=state.tool==='glow'?18:0;ctx.shadowColor=state.drawColor;ctx.strokeStyle=strokeStyle();ctx.lineWidth=state.tool==='eraser'?28:state.drawSize;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function drawDot(p){drawLine(p,{x:p.x+.1,y:p.y+.1})}
function clearDraw(){const c=state.drawCanvas;state.drawCtx.clearRect(0,0,c.width,c.height)}
function saveDrawing(){try{localStorage.kaw_last_art=state.drawCanvas.toDataURL('image/png');showModal('💾 Siap Simpan','Lukisan disimpan dalam browser ini.')}catch(e){showModal('Info','Lukisan terlalu besar untuk disimpan.') }}
function makeRace(){const area=$('playArea');area.innerHTML=`<div class="race-stage" id="raceStage"><div class="mountain"></div><div class="road"><div class="road-line"></div></div><div class="race-hint">🏎️ Elak batu/palang. Ambil coin. Button boleh drag bila Edit ON.</div><div class="car" id="car"><div class="wheel w1"></div><div class="wheel w2"></div></div><button class="drive-btn" id="leftBtn">◀</button><button class="drive-btn" id="rightBtn">▶</button><div class="drive-panel" id="drivePanel"><label>Saiz Console</label><input id="sizeRange" type="range" min="56" max="110"><label>Opacity</label><input id="opRange" type="range" min="45" max="100"><button onclick="toggleEdit()">🎮 Edit Posisi</button><button onclick="resetControls()">Reset</button></div></div>`;initRace()}
function initRace(){const cfg=JSON.parse(localStorage.kaw_drive_cfg||'{}');state.race={x:50,left:false,right:false,edit:false,obs:[],timer:null,spawn:null,speed:3.2};const lb=$('leftBtn'),rb=$('rightBtn'),panel=$('drivePanel');function apply(){const size=cfg.size||74,op=(cfg.opacity||88)/100;[lb,rb].forEach(b=>{b.style.width=size+'px';b.style.height=size+'px';b.style.opacity=op});lb.style.left=(cfg.lx||22)+'px';lb.style.bottom=(cfg.ly||118)+'px';rb.style.right=(cfg.rx||22)+'px';rb.style.bottom=(cfg.ry||118)+'px';$('sizeRange').value=size;$('opRange').value=cfg.opacity||88}apply();$('sizeRange').oninput=e=>{cfg.size=+e.target.value;saveCfg();apply()};$('opRange').oninput=e=>{cfg.opacity=+e.target.value;saveCfg();apply()};function saveCfg(){localStorage.kaw_drive_cfg=JSON.stringify(cfg)}
 function hold(btn,side){btn.onpointerdown=e=>{if(state.race.edit)return startDrag(btn,side,e);state.race[side]=true;btn.setPointerCapture(e.pointerId)};btn.onpointerup=btn.onpointercancel=()=>state.race[side]=false}hold(lb,'left');hold(rb,'right');window.onkeydown=e=>{if(e.key==='ArrowLeft')state.race.left=true;if(e.key==='ArrowRight')state.race.right=true;if(e.key.toLowerCase()==='c')panel.classList.toggle('show')};window.onkeyup=e=>{if(e.key==='ArrowLeft')state.race.left=false;if(e.key==='ArrowRight')state.race.right=false};panel.classList.add('show');setTimeout(()=>panel.classList.remove('show'),2600);state.race.timer=setInterval(raceLoop,16);state.race.spawn=setInterval(spawnObstacle,900)}
function toggleEdit(){state.race.edit=!state.race.edit;document.querySelectorAll('.drive-btn').forEach(b=>b.classList.toggle('editing',state.race.edit));showModal(state.race.edit?'🎮 Edit ON':'🎮 Edit OFF',state.race.edit?'Drag button kiri/kanan ke tempat yang selesa.':'Posisi controller disimpan.')}
function startDrag(btn,side,e){const cfg=JSON.parse(localStorage.kaw_drive_cfg||'{}');const start={x:e.clientX,y:e.clientY,l:btn.offsetLeft,t:btn.offsetTop};btn.setPointerCapture(e.pointerId);btn.onpointermove=ev=>{const x=start.l+(ev.clientX-start.x),y=start.t+(ev.clientY-start.y);btn.style.left=x+'px';btn.style.right='auto';btn.style.top=y+'px';btn.style.bottom='auto'};btn.onpointerup=()=>{const parent=$('raceStage').getBoundingClientRect();const r=btn.getBoundingClientRect();if(side==='left'){cfg.lx=r.left-parent.left;cfg.ly=parent.bottom-r.bottom}else{cfg.rx=parent.right-r.right;cfg.ry=parent.bottom-r.bottom}localStorage.kaw_drive_cfg=JSON.stringify(cfg);btn.onpointermove=null;};}
function resetControls(){localStorage.removeItem('kaw_drive_cfg');restartGame()}
function spawnObstacle(){const st=$('raceStage'); if(!st) return; const isCoin=Math.random()<.35;const el=document.createElement('div');el.className=isCoin?'coin':'obstacle';el.textContent=isCoin?'🪙':['🪨','🚧','🔺','🕳️'][Math.floor(Math.random()*4)];el.style.left=(25+Math.random()*50)+'%';st.appendChild(el);state.race.obs.push({el,y:-70,coin:isCoin})}
function raceLoop(){const r=state.race;if(!r)return;if(r.left)r.x-=.55;if(r.right)r.x+=.55;r.x=Math.max(23,Math.min(77,r.x));const car=$('car'); if(car)car.style.left=r.x+'%';const stage=$('raceStage')?.getBoundingClientRect(),carR=car?.getBoundingClientRect();r.obs.forEach(o=>{o.y+=r.speed;o.el.style.top=o.y+'px';const or=o.el.getBoundingClientRect();if(carR&&hit(carR,or)){if(o.coin){addReward(1,2);o.el.remove()}else crash();o.dead=true}});r.obs=r.obs.filter(o=>!o.dead&&o.y<(stage?.height||800)+80)}
function hit(a,b){return !(a.right<b.left+10||a.left>b.right-10||a.bottom<b.top+10||a.top>b.bottom-10)}
function crash(){const st=$('raceStage');if(!st)return;st.classList.add('crash');setTimeout(()=>st.classList.remove('crash'),450);['💥','💨'].forEach((x,i)=>{const e=document.createElement('div');e.className=i?'smoke':'spark';e.textContent=x;st.appendChild(e);setTimeout(()=>e.remove(),800)});addReward(0,0)}
function stopRace(){if(state.race){clearInterval(state.race.timer);clearInterval(state.race.spawn);state.race=null}window.onkeydown=null;window.onkeyup=null}
function openSettings(){if(state.world?.id==='race'){$('drivePanel')?.classList.toggle('show')}else showModal('⚙️ Setting','Sound, controller dan reward boleh ditambah lagi selepas ini.')}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
