<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Produk Game Kanak-Kanak - Menu A B C D + Navigation</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffd93d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kids Games">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap');
    :root{--sky:#8ee7ff;--sky2:#e8fbff;--navy:#17324d;--yellow:#ffd93d;--pink:#ff7ac8;--mint:#98f35f;--blue:#3abef9;--shadow:0 14px 35px rgba(23,50,77,.18)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Fredoka','Nunito',system-ui,sans-serif;background:linear-gradient(180deg,var(--sky2),var(--sky));color:var(--navy);touch-action:manipulation}
    .game-shell{position:relative;width:100vw;height:100vh;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.75),transparent 18%),radial-gradient(circle at 82% 10%,rgba(255,217,61,.45),transparent 15%),linear-gradient(180deg,#dffaff 0%,#93eaff 55%,#78d977 100%)}
    .cloud{position:absolute;width:150px;height:55px;background:#fff;border-radius:999px;opacity:.9;filter:drop-shadow(0 8px 8px rgba(0,0,0,.05));animation:floatCloud 18s linear infinite;z-index:1}
    .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud::before{width:70px;height:70px;left:25px;top:-30px}.cloud::after{width:55px;height:55px;right:26px;top:-18px}
    .cloud.c1{left:-170px;top:86px;animation-duration:20s}.cloud.c2{left:-220px;top:180px;transform:scale(.75);animation-delay:7s;animation-duration:25s}.cloud.c3{left:-240px;top:42px;transform:scale(.6);animation-delay:12s;animation-duration:28s}
    @keyframes floatCloud{from{translate:0 0}to{translate:calc(100vw + 280px) 0}}
    .rainbow{position:absolute;left:50%;bottom:65px;width:300px;height:150px;translate:-50% 0;border-radius:300px 300px 0 0;background:radial-gradient(ellipse at bottom,transparent 0 42%,#fff 43% 47%,transparent 48%),conic-gradient(from 180deg at 50% 100%,#ff7ac8,#ffd93d,#98f35f,#3abef9,#b99cff,transparent 65%);opacity:.72;z-index:1}
    .grass{position:absolute;left:0;right:0;bottom:0;height:95px;background:radial-gradient(circle at 10% 100%,#49b94b 0 45px,transparent 46px),radial-gradient(circle at 28% 100%,#61cf5e 0 50px,transparent 51px),radial-gradient(circle at 48% 100%,#46b849 0 55px,transparent 56px),radial-gradient(circle at 72% 100%,#61cf5e 0 50px,transparent 51px),radial-gradient(circle at 92% 100%,#46b849 0 48px,transparent 49px),linear-gradient(180deg,#6bd765,#42b548);z-index:2}
    .top-bar{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:20}
    .pill{display:flex;align-items:center;gap:8px;min-height:54px;padding:10px 14px;border:4px solid rgba(23,50,77,.11);border-radius:24px;background:rgba(255,255,255,.86);box-shadow:var(--shadow);backdrop-filter:blur(8px);font-weight:800}
    .score-pill{min-width:94px;justify-content:center;font-size:21px}.timer-pill{min-width:92px;justify-content:center;font-size:20px}.timer-pill.warning{animation:timerPulse .55s infinite alternate;background:#fff5b8;border-color:#ffbd30}@keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.06)}}.level-pill{flex:1;justify-content:center;text-align:center;font-size:16px;max-width:230px}
    .icon-btn{width:56px;height:56px;border:0;border-radius:20px;box-shadow:var(--shadow);background:#fff;font-size:25px;cursor:pointer}.icon-btn:active{transform:scale(.92)}
    .instruction-card{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:16px;right:16px;z-index:19;min-height:70px;border-radius:28px;padding:12px 16px;background:linear-gradient(135deg,#fff,#fff7ca);border:4px solid rgba(255,217,61,.65);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900}
    .game-area{position:absolute;inset:0;z-index:10}
    .fall-item{position:absolute;width:82px;height:82px;border:0;background:transparent;cursor:pointer;font-size:68px;line-height:1;filter:drop-shadow(0 10px 10px rgba(0,0,0,.14));animation:fall linear forwards,wiggle 1s ease-in-out infinite;will-change:transform,top}
    .fall-label{position:absolute;left:50%;top:50%;translate:-50% -46%;font-size:28px;font-weight:900;color:#17324d;text-shadow:0 2px 0 rgba(255,255,255,.9);pointer-events:none}
    @keyframes fall{from{top:-90px}to{top:calc(100vh + 95px)}}@keyframes wiggle{0%,100%{rotate:-5deg}50%{rotate:5deg}}
    .touch-ring{position:absolute;width:18px;height:18px;border:5px solid rgba(255,255,255,.95);border-radius:50%;pointer-events:none;z-index:90;box-shadow:0 0 0 6px rgba(255,217,61,.45);animation:touchRing .45s ease-out forwards}@keyframes touchRing{to{transform:scale(4);opacity:0}}
    .pop{position:absolute;width:88px;height:88px;border-radius:50%;pointer-events:none;z-index:30;animation:popBurst .55s ease-out forwards;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.1)}
    @keyframes popBurst{0%{transform:scale(.4);opacity:0;background:rgba(255,217,61,.95)}45%{transform:scale(1.25);opacity:1;background:rgba(255,122,200,.9)}100%{transform:scale(1.75);opacity:0;background:rgba(152,243,95,0)}}
    .confetti{position:absolute;width:11px;height:16px;border-radius:4px;pointer-events:none;z-index:31;animation:confettiFly .7s ease-out forwards}@keyframes confettiFly{to{transform:translate(var(--x),var(--y)) rotate(420deg);opacity:0}}
    .bottom-dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:22;display:flex;gap:10px;align-items:center;justify-content:center}
    .big-btn{border:0;border-radius:24px;padding:14px 18px;min-height:58px;background:linear-gradient(135deg,var(--yellow),#ffb72e);color:#17324d;font-size:18px;font-weight:900;box-shadow:0 12px 0 #d99212,var(--shadow);cursor:pointer}.big-btn:active{transform:translateY(5px);box-shadow:0 7px 0 #d99212,var(--shadow)}
    .small-btn{border:0;border-radius:20px;padding:12px 14px;min-height:52px;background:#fff;color:#17324d;font-size:16px;font-weight:900;box-shadow:var(--shadow);cursor:pointer}
    .admin-link{position:absolute;right:12px;bottom:108px;z-index:45;text-decoration:none;border-radius:999px;background:rgba(255,255,255,.82);border:3px solid rgba(255,255,255,.95);box-shadow:var(--shadow);color:#17324d;font-size:14px;font-weight:900;padding:10px 13px}
    .admin-link:active{transform:scale(.96)}

    .game-nav{position:absolute;top:calc(env(safe-area-inset-top) + 170px);left:12px;right:12px;z-index:24;display:none;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .game-nav.show{display:grid}
    .nav-game-btn{border:0;border-radius:18px;min-height:48px;padding:9px 8px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);color:#17324d;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer}
    .nav-game-btn:active{transform:scale(.95)}
    @media(max-width:420px){.game-nav{top:calc(env(safe-area-inset-top) + 162px);gap:6px}.nav-game-btn{font-size:12px;min-height:44px;padding:7px 5px}.instruction-card{font-size:19px}}
    .empty-note{font-size:17px;font-weight:900;background:#fff;border-radius:22px;padding:14px;margin:12px 0;color:#b45309}
    .overlay{position:absolute;inset:0;z-index:80;background:rgba(31,66,93,.25);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}
    .modal{width:min(460px,94vw);max-height:92dvh;overflow-y:auto;border-radius:36px;background:linear-gradient(180deg,#fff,#fff7d9);border:6px solid #fff;box-shadow:0 30px 70px rgba(0,0,0,.2);padding:22px 18px;text-align:center;animation:modalIn .25s ease-out;scrollbar-width:thin}@keyframes modalIn{from{transform:translateY(20px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
    .modal h1{margin:4px 0 8px;font-size:34px;line-height:1.05}.modal p{margin:8px auto 16px;font-size:19px;font-weight:800;max-width:320px}.star-row{display:flex;justify-content:center;gap:8px;font-size:48px;margin:10px 0 14px;animation:bounceStars .7s ease-in-out infinite alternate}@keyframes bounceStars{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    .level-map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 18px}.level-node{height:48px;border-radius:16px;display:grid;place-items:center;background:#eaf7ff;border:3px solid rgba(58,190,249,.3);font-size:20px;font-weight:900}.level-node.active{background:linear-gradient(135deg,#ffd93d,#ff7ac8);color:#fff;transform:scale(1.06)}.level-node.done{background:linear-gradient(135deg,#98f35f,#3abef9);color:#fff}

    .choice-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}.choice-card{width:100%;border:0;border-radius:26px;padding:15px 14px;background:linear-gradient(135deg,#fff,#e8fbff);box-shadow:0 10px 0 rgba(58,190,249,.28),var(--shadow);font-family:inherit;color:var(--navy);text-align:left;cursor:pointer}.choice-card strong{display:block;font-size:23px;line-height:1.05}.choice-card span{display:block;font-size:15px;font-weight:900;margin-top:5px;color:#365a78}.choice-card small{display:inline-flex;margin-top:10px;padding:7px 11px;border-radius:999px;background:#ffd93d;font-weight:900}.choice-card.trace{background:linear-gradient(135deg,#fff7d9,#fff)}.choice-card.printable{background:linear-gradient(135deg,#f5fff0,#fff)}.choice-card.car{background:linear-gradient(135deg,#eaf4ff,#fff)}.choice-card:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(58,190,249,.22),var(--shadow)}.back-choice{margin-top:10px;background:#fff}.hidden{display:none!important}.section-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:#17324d;color:white;padding:7px 12px;font-size:13px;font-weight:900;margin-bottom:8px}


    .car-stage{position:absolute;left:50%;top:52%;translate:-50% -50%;width:min(92vw,520px);height:min(62vh,460px);border-radius:34px;overflow:hidden;border:6px solid #fff;box-shadow:var(--shadow);background:linear-gradient(180deg,#87ceff 0 18%,#56c271 18% 30%,#565f6b 30% 100%)}
    .car-road{position:absolute;left:50%;top:28%;bottom:0;width:58%;translate:-50% 0;background:#3f4752;border-left:8px solid #fff;border-right:8px solid #fff;overflow:hidden}
    .car-road::before{content:"";position:absolute;left:50%;top:-60px;width:10px;height:140%;translate:-50% 0;background:repeating-linear-gradient(180deg,#ffd93d 0 28px,transparent 28px 58px);animation:roadMove .7s linear infinite}
    @keyframes roadMove{to{translate:-50% 58px}}
    .kid-car{position:absolute;bottom:24px;left:50%;translate:-50% 0;width:54px;height:82px;border-radius:22px 22px 14px 14px;background:linear-gradient(180deg,#ff7ac8,#ff428d);border:4px solid #fff;box-shadow:0 10px 18px rgba(0,0,0,.25);z-index:3;transition:left .12s ease}
    .kid-car::before{content:"🚗";position:absolute;inset:0;display:grid;place-items:center;font-size:42px}
    .road-item{position:absolute;top:-68px;left:50%;translate:-50% 0;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:#fff;border:4px solid rgba(23,50,77,.15);box-shadow:0 10px 18px rgba(0,0,0,.18);animation:fallRoad 2.6s linear forwards;z-index:2}
    @keyframes fallRoad{to{top:110%}}
    .car-controls{position:absolute;left:50%;bottom:18px;translate:-50% 0;display:flex;gap:18px;z-index:25}
    .drive-btn{width:96px;height:70px;border:0;border-radius:26px;background:#fff;box-shadow:0 8px 0 rgba(23,50,77,.16),var(--shadow);font-size:38px;font-weight:900;cursor:pointer}.drive-btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(23,50,77,.12),var(--shadow)}

    .trace-stage{position:absolute;left:50%;top:52%;translate:-50% -50%;width:min(86vw,420px);height:min(58vh,420px);border-radius:36px;background:rgba(255,255,255,.82);border:6px solid rgba(255,255,255,.96);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;touch-action:none}
    .trace-guide{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(150px,42vw,285px);font-weight:900;color:rgba(23,50,77,.12);line-height:1;font-family:'Fredoka','Noto Sans Arabic','Arial',sans-serif;user-select:none;pointer-events:none}
    .trace-guide.jawi{font-family:'Noto Sans Arabic','Amiri','Arial',sans-serif;font-size:clamp(170px,48vw,310px)}
    .trace-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .trace-progress{position:absolute;left:18px;right:18px;bottom:16px;height:22px;border-radius:999px;background:rgba(23,50,77,.12);overflow:hidden;border:3px solid rgba(255,255,255,.9)}
    .trace-progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));transition:width .15s ease}
    .trace-tip{position:absolute;top:14px;left:14px;right:14px;text-align:center;font-size:17px;font-weight:900;background:rgba(255,255,255,.75);padding:8px 10px;border-radius:18px}
    @media(max-width:420px){.top-bar{height:62px;gap:7px}.pill{min-height:48px;padding:8px 10px;border-radius:20px}.score-pill,.timer-pill{min-width:76px;font-size:18px}.level-pill{font-size:13px}.icon-btn{width:48px;height:48px;border-radius:17px;font-size:22px}.instruction-card{top:calc(env(safe-area-inset-top) + 82px);font-size:19px;min-height:62px}.fall-item{width:70px;height:70px;font-size:58px}.fall-label{font-size:23px}.modal h1{font-size:30px}.big-btn{font-size:16px;padding:13px 15px}}
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell">
    <div class="rainbow"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="grass"></div>
    <section class="top-bar">
      <div class="pill score-pill">⭐ <span id="scoreText">0</span></div>
      <div class="pill level-pill" id="levelTitle">Loading...</div>
      <div class="pill timer-pill" id="timerPill">⏰ <span id="timeText">60</span></div>
      <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
    </section>
    <a class="admin-link" href="admin/control-panel.html">⚙️ Control</a>
    <section class="instruction-card" id="instructionText">Sedia...</section>
    <section class="game-nav" id="gameNav">
      <button class="nav-game-btn" id="backCategoryBtn">⬅️ Back</button>
      <button class="nav-game-btn" id="homeMenuBtn">🏠 Menu</button>
      <button class="nav-game-btn" id="restartGameBtn">🔄 Restart</button>
    </section>
    <section class="game-area" id="gameArea"></section>
    <section class="bottom-dock"><button class="small-btn" id="pauseBtn">⏸️ Pause</button><button class="big-btn" id="startBtn">▶️ Mula Main</button></section>
    <section class="overlay show" id="startOverlay">
      <div class="modal" id="choicePanel">
        <h1>🌟 Pilih Jenis Game</h1>
        <p>Pilih bahagian A, B, C atau D. Control Panel boleh aktif/nyahaktifkan menu dan game.</p><div class="section-badge">Versi 1.2.9 • Back / Home / Restart</div>
        <div class="choice-grid">
          <button class="choice-card" id="playGamesChoice"><strong>🎮 A. Play Games</strong><span>10 game interaktif: bintang, belon, warna, nombor, ABC dan objek.</span><small>10 GAME</small></button>
          <button class="choice-card trace" id="traceLearnChoice"><strong>✏️ B. Trace & Learn</strong><span>10 game lakaran: nombor, ABC dan Jawi guna jari/touch.</span><small>10 GAME</small></button>
          <button class="choice-card printable" id="worksheetChoice"><strong>📄 C. Worksheet Games</strong><span>10 aktiviti latihan: warna, bentuk, padanan, susun dan pilih jawapan.</span><small>10 GAME</small></button>
          <button class="choice-card car" id="carChoice"><strong>🚗 D. Drive Control</strong><span>10 game kawal kereta kiri kanan. Ambil item betul dan elak item salah.</span><small>10 GAME</small></button>
        </div>
      </div>
      <div class="modal hidden" id="levelPanel">
        <div class="section-badge" id="selectedSectionBadge">🎮 Play Games</div>
        <h1 id="sectionTitle">Pilih Game</h1>
        <p id="sectionDesc">10 game tersedia.</p>
        <div class="level-map" id="startLevelMap"></div>
        <button class="big-btn" id="playNowBtn">▶️ Mula Game 1</button>
        <button class="small-btn back-choice" id="backChoiceBtn">⬅️ Tukar Pilihan</button>
      </div>
    </section>
    <section class="overlay" id="rewardOverlay"><div class="modal"><h1 id="rewardTitle">Syabas!</h1><div class="star-row" id="rewardStars">⭐⭐⭐</div><p id="rewardText">Hebat!</p><div class="level-map" id="rewardLevelMap"></div><button class="big-btn" id="nextBtn">➡️ Seterusnya</button></div></section>
  </main>
  <script>
    const BANK_PATH='data/question-bank.json';
    const $=id=>document.getElementById(id);
    const gameArea=$('gameArea'), scoreText=$('scoreText'), timeText=$('timeText'), timerPill=$('timerPill'), levelTitle=$('levelTitle'), instructionText=$('instructionText'), soundBtn=$('soundBtn'), startBtn=$('startBtn'), playNowBtn=$('playNowBtn'), pauseBtn=$('pauseBtn'), rewardOverlay=$('rewardOverlay'), startOverlay=$('startOverlay'), nextBtn=$('nextBtn'), rewardTitle=$('rewardTitle'), rewardText=$('rewardText'), rewardStars=$('rewardStars'), rewardLevelMap=$('rewardLevelMap'), startLevelMap=$('startLevelMap'), gameShell=$('gameShell'), choicePanel=$('choicePanel'), levelPanel=$('levelPanel'), playGamesChoice=$('playGamesChoice'), traceLearnChoice=$('traceLearnChoice'), worksheetChoice=$('worksheetChoice'), carChoice=$('carChoice'), backChoiceBtn=$('backChoiceBtn'), sectionTitle=$('sectionTitle'), sectionDesc=$('sectionDesc'), selectedSectionBadge=$('selectedSectionBadge'), gameNav=$('gameNav'), backCategoryBtn=$('backCategoryBtn'), homeMenuBtn=$('homeMenuBtn'), restartGameBtn=$('restartGameBtn');
    let bank,allGames=[],games=[],selectedMode='',currentGame=0,score=0,totalScore=0,timeLeft=60,running=false,paused=false,spawnTimer=null,countdownTimer=null,audioCtx=null,soundOn=true,musicTimer=null,encourageTimer=null,lastAlmost=false,traceDone=false,traceCanvas=null,traceCtx=null,traceProgress=0,traceDrawing=false,carX=50,carMoveDir=0,carMoveTimer=null,carSpawnTimer=null;

    const CONTROL_KEY='STANDBY_GAME_CONTROL_V1';
    function defaultControl(){
      return {
        categories:{play:true,trace:true,worksheet:true,car:true},
        labels:{play:'🎮 A. Play Games',trace:'✏️ B. Trace & Learn',worksheet:'📄 C. Worksheet Games',car:'🚗 D. Drive Control'},
        hiddenGames:{}
      };
    }
    function getControl(){
      try{ return Object.assign(defaultControl(), JSON.parse(localStorage.getItem(CONTROL_KEY)||'{}')); }catch(e){ return defaultControl(); }
    }
    function isGameAllowed(g,control){ return !control.hiddenGames?.[g.id]; }
    function updateChoiceVisibility(){
      const c=getControl();
      playGamesChoice.classList.toggle('hidden', c.categories?.play===false);
      traceLearnChoice.classList.toggle('hidden', c.categories?.trace===false);
      worksheetChoice.classList.toggle('hidden', c.categories?.worksheet===false);
      carChoice.classList.toggle('hidden', c.categories?.car===false);
      playGamesChoice.querySelector('strong').textContent=c.labels?.play||'🎮 A. Play Games';
      traceLearnChoice.querySelector('strong').textContent=c.labels?.trace||'✏️ B. Trace & Learn';
      worksheetChoice.querySelector('strong').textContent=c.labels?.worksheet||'📄 C. Worksheet Games';
      carChoice.querySelector('strong').textContent=c.labels?.car||'🚗 D. Drive Control';
      const visible=[playGamesChoice,traceLearnChoice,worksheetChoice,carChoice].some(btn=>!btn.classList.contains('hidden'));
      let note=document.getElementById('emptyControlNote');
      if(!visible){
        if(!note){ note=document.createElement('div'); note.id='emptyControlNote'; note.className='empty-note'; note.textContent='Semua kategori sedang OFF. Buka ⚙️ Control untuk aktifkan semula.'; choicePanel.querySelector('.choice-grid').after(note); }
      }else if(note){ note.remove(); }
    }
    async function loadBank(){
      const res=await fetch(BANK_PATH,{cache:'no-store'}); bank=await res.json();
      const control=getControl();
      allGames=(bank.games||[]).filter(g=>isGameAllowed(g,control)); games=[];
      updateChoiceVisibility();
      levelTitle.textContent='Pilih Jenis Game'; instructionText.textContent='Pilih A Play Games, B Trace & Learn, C Worksheet Games atau D Drive Control'; timeText.textContent='60';
    }
    function selectMode(mode){
      showGameNav(false);
      selectedMode=mode; currentGame=0; totalScore=0;
      if(mode==='play'){
        games=allGames.filter(g=>g.mode!=='trace' && g.mode!=='worksheet').slice(0,10);
        selectedSectionBadge.textContent='🎮 A. Play Games';
        sectionTitle.textContent='🎮 Play Games';
        sectionDesc.textContent='10 game interaktif. Tekan Mula untuk bermain mengikut turutan.';
        playNowBtn.textContent='▶️ Mula Play Games';
      }else if(mode==='trace'){
        games=allGames.filter(g=>g.mode==='trace').slice(0,10);
        selectedSectionBadge.textContent='✏️ B. Trace & Learn';
        sectionTitle.textContent='✏️ Trace & Learn';
        sectionDesc.textContent='10 game lakaran nombor, ABC dan Jawi.';
        playNowBtn.textContent='✏️ Mula Trace & Learn';
      }else if(mode==='worksheet'){
        games=allGames.filter(g=>g.mode==='worksheet').slice(0,10);
        selectedSectionBadge.textContent='📄 C. Worksheet Games';
        sectionTitle.textContent='📄 Worksheet Games';
        sectionDesc.textContent='10 aktiviti latihan seperti worksheet interaktif.';
        playNowBtn.textContent='📄 Mula Worksheet Games';
      }else{
        games=allGames.filter(g=>g.mode==='car').slice(0,10);
        selectedSectionBadge.textContent='🚗 D. Drive Control';
        sectionTitle.textContent='🚗 Drive Control';
        sectionDesc.textContent='10 game kawal kereta kiri kanan. Ambil item betul dan elak item salah.';
        playNowBtn.textContent='🚗 Mula Drive Control';
      }
      choicePanel.classList.add('hidden'); levelPanel.classList.remove('hidden');
      if(games.length){ levelTitle.textContent=games[0].title; instructionText.textContent=games[0].instructionText; timeText.textContent=games[0].durationSeconds||60; }
      buildMap(startLevelMap);
    }
    function showChoice(){
      showGameNav(false);
      running=false; paused=false; clearGame(); stopMusic(); clearInterval(encourageTimer);
      startOverlay.classList.add('show'); rewardOverlay.classList.remove('show');
      choicePanel.classList.remove('hidden'); levelPanel.classList.add('hidden'); selectedMode=''; currentGame=0; totalScore=0; updateChoiceVisibility();
      levelTitle.textContent='Pilih Jenis Game'; instructionText.textContent='Pilih A Play Games, B Trace & Learn, C Worksheet Games atau D Drive Control'; scoreText.textContent='0'; timeText.textContent='60';
    }
    function initAudio(){ if(audioCtx) return; audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
    function tone(freq=600,duration=.13,type='sine',gain=.12){
      if(!soundOn) return; initAudio(); const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type=type; osc.frequency.value=freq; g.gain.setValueAtTime(gain,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+duration);
    }
    function sfxCorrect(){tone(720,.07,'sine',.11);setTimeout(()=>tone(980,.10,'triangle',.10),65)}
    function sfxWrong(){tone(220,.14,'sine',.09)}
    function sfxTap(){tone(520,.035,'triangle',.035)}
    function sfxTick(){tone(930,.045,'square',.04)}
    function sfxReward(){tone(620,.08,'triangle',.12);setTimeout(()=>tone(820,.08,'triangle',.12),90);setTimeout(()=>tone(1040,.16,'triangle',.12),180)}
    function startMusic(){
      clearInterval(musicTimer); if(!soundOn) return; initAudio();
      const notes=[523,659,784,659,587,698,880,698,659,784,988,784]; let i=0;
      musicTimer=setInterval(()=>{ if(!running||paused||!soundOn) return; tone(notes[i++%notes.length],.28,'triangle',.028); },360);
    }
    function stopMusic(){clearInterval(musicTimer)}
    function speak(text,rate=.92,pitch=1.18){
      if(!soundOn || !bank?.settings?.enableVoiceInstruction || !('speechSynthesis' in window) || !text) return;
      try{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        const voices=speechSynthesis.getVoices();
        const ms=voices.find(v=>/ms|malay|malaysia/i.test(v.lang+' '+v.name));
        const female=voices.find(v=>/female|woman|zira|siti|google/i.test(v.name) && /ms|id|en/i.test(v.lang));
        u.voice=ms||female||voices[0]||null; u.lang='ms-MY'; u.rate=rate; u.pitch=pitch; u.volume=.95; speechSynthesis.speak(u);
      }catch(e){}
    }
    function touchEffect(x,y){
      if(!bank?.settings?.enableTouchEffect) return;
      const r=document.createElement('div'); r.className='touch-ring'; r.style.left=(x-9)+'px'; r.style.top=(y-9)+'px'; document.body.appendChild(r); setTimeout(()=>r.remove(),500);
    }
    gameShell.addEventListener('pointerdown',e=>{touchEffect(e.clientX,e.clientY); if(running) sfxTap();},{passive:true});
    function buildMap(el){el.innerHTML='';games.forEach((g,i)=>{const n=document.createElement('div');n.className='level-node';n.title=(g.category?g.category+' - ':'')+g.title;if(i<currentGame)n.classList.add('done');if(i===currentGame)n.classList.add('active');n.textContent=i<currentGame?'✅':(g.category==='Nombor'?'🔢':g.category==='ABC'?'🔤':g.category==='Jawi'?'ج':g.mode==='car'?'🚗':i+1);el.appendChild(n)})}
    const random=(a,b)=>Math.random()*(b-a)+a;
    function itemData(){const items=games[currentGame].items||[{icon:'⭐',label:'',isCorrect:true}];return items[Math.floor(Math.random()*items.length)]}
    function spawnItem(){
      if(!running||paused)return; const data=itemData(); const btn=document.createElement('button'); btn.className='fall-item';
      btn.innerHTML=(data.icon||'⭐')+(data.label?`<span class="fall-label">${data.label}</span>`:''); btn.style.left=random(6,82)+'vw'; btn.style.animationDuration=random(4.6,7.2)+'s'; btn.style.transform=`scale(${random(.86,1.18)})`;
      btn.addEventListener('pointerdown',e=>{e.preventDefault(); const rect=btn.getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top+rect.height/2;
        if(data.isCorrect){score++;totalScore++;scoreText.textContent=score;sfxCorrect();showPop(x,y,'+1');confetti(x,y);btn.remove()}
        else{sfxWrong();showPop(x,y,'😅');btn.animate([{transform:'translateX(0)'},{transform:'translateX(-12px)'},{transform:'translateX(12px)'},{transform:'translateX(0)'}],{duration:220})}
      },{passive:false});
      gameArea.appendChild(btn); setTimeout(()=>btn.remove(),7600);
    }
    
    function setupTraceGame(g){
      traceDone=false; traceProgress=0; score=0; scoreText.textContent='0%';
      const stage=document.createElement('div'); stage.className='trace-stage';
      const tip=document.createElement('div'); tip.className='trace-tip'; tip.textContent='Ikut lakaran besar dengan jari sampai penuh';
      const guide=document.createElement('div'); guide.className='trace-guide '+(g.category==='Jawi'?'jawi':''); guide.textContent=g.traceText||'?';
      const bar=document.createElement('div'); bar.className='trace-progress'; const fill=document.createElement('div'); fill.className='trace-progress-fill'; bar.appendChild(fill);
      traceCanvas=document.createElement('canvas'); traceCanvas.className='trace-canvas';
      stage.appendChild(guide); stage.appendChild(traceCanvas); stage.appendChild(tip); stage.appendChild(bar); gameArea.appendChild(stage);
      const resize=()=>{const r=stage.getBoundingClientRect(); traceCanvas.width=Math.floor(r.width*devicePixelRatio); traceCanvas.height=Math.floor(r.height*devicePixelRatio); traceCanvas.style.width=r.width+'px'; traceCanvas.style.height=r.height+'px'; traceCtx=traceCanvas.getContext('2d'); traceCtx.scale(devicePixelRatio,devicePixelRatio); traceCtx.lineCap='round'; traceCtx.lineJoin='round'; traceCtx.lineWidth=22; traceCtx.strokeStyle='rgba(255,122,200,.92)'};
      resize();
      const point=e=>{const r=traceCanvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}};
      const addProgress=()=>{ if(traceDone) return; traceProgress=Math.min(100,traceProgress+2.2); score=Math.floor(traceProgress); scoreText.textContent=score+'%'; fill.style.width=score+'%'; if(score>=100){traceDone=true; totalScore+=100; sfxReward(); confetti(innerWidth/2,innerHeight/2); speak('Hebat. Lakaran siap.'); setTimeout(endGame,650)} };
      traceCanvas.addEventListener('pointerdown',e=>{e.preventDefault(); traceDrawing=true; const p=point(e); traceCtx.beginPath(); traceCtx.moveTo(p.x,p.y); addProgress();}, {passive:false});
      traceCanvas.addEventListener('pointermove',e=>{if(!traceDrawing||paused)return; e.preventDefault(); const p=point(e); traceCtx.lineTo(p.x,p.y); traceCtx.stroke(); addProgress();}, {passive:false});
      window.addEventListener('pointerup',()=>{traceDrawing=false},{once:false});
    }
    function showPop(x,y,t){const p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=(x-44)+'px';p.style.top=(y-44)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),650)}
    function confetti(x,y){['#ffd93d','#ff7ac8','#98f35f','#3abef9','#b99cff'].forEach((c,i)=>{for(let j=0;j<3;j++){const e=document.createElement('div');e.className='confetti';e.style.left=x+'px';e.style.top=y+'px';e.style.background=c;e.style.setProperty('--x',random(-95,95)+'px');e.style.setProperty('--y',random(-95,55)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),800)}})}


    function showGameNav(show){ gameNav.classList.toggle('show', !!show); }
    function backToCategory(){
      running=false; paused=false; clearGame(); stopMusic(); clearInterval(encourageTimer);
      rewardOverlay.classList.remove('show'); startOverlay.classList.add('show');
      choicePanel.classList.add('hidden'); levelPanel.classList.remove('hidden');
      showGameNav(false); buildMap(startLevelMap);
      if(games[currentGame]){ levelTitle.textContent=games[currentGame].title; instructionText.textContent=games[currentGame].instructionText; timeText.textContent=games[currentGame].durationSeconds||60; }
    }
    function homeMenu(){ showChoice(); showGameNav(false); }
    function restartCurrentGame(){ if(!selectedMode || !games.length){ showChoice(); return; } startGame(); }

    function setupCarGame(g){
      gameArea.innerHTML='<div class="car-stage"><div class="car-road" id="carRoad"><div class="kid-car" id="kidCar"></div></div></div><div class="car-controls"><button class="drive-btn" id="leftDrive">⬅️</button><button class="drive-btn" id="rightDrive">➡️</button></div>';
      carX=50; updateCar();
      const left=$('leftDrive'), right=$('rightDrive');
      const press=(dir)=>{carMoveDir=dir; moveCar(dir*10);};
      const release=()=>{carMoveDir=0;};
      left.addEventListener('pointerdown',e=>{e.preventDefault();press(-1)}); right.addEventListener('pointerdown',e=>{e.preventDefault();press(1)});
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>{left.addEventListener(ev,release);right.addEventListener(ev,release)});
      document.onkeydown=(e)=>{if(!running||paused)return;if(e.key==='ArrowLeft')moveCar(-10);if(e.key==='ArrowRight')moveCar(10)};
      carMoveTimer=setInterval(()=>{if(running&&!paused&&carMoveDir)moveCar(carMoveDir*4)},70);
      carSpawnTimer=setInterval(()=>spawnRoadItem(g),780);
      spawnRoadItem(g); spawnRoadItem(g);
    }
    function updateCar(){const car=$('kidCar'); if(car) car.style.left=carX+'%';}
    function moveCar(delta){carX=Math.max(18,Math.min(82,carX+delta));updateCar();sfxTap();}
    function spawnRoadItem(g){
      if(!running||paused)return;
      const road=$('carRoad'); if(!road)return;
      const items=g.items||[{icon:'⭐',isCorrect:true},{icon:'🚧',isCorrect:false}];
      const data=items[Math.floor(Math.random()*items.length)];
      const el=document.createElement('div'); el.className='road-item'; el.textContent=data.icon||'⭐'; el.dataset.correct=data.isCorrect?'1':'0';
      el.style.left=(25+Math.random()*50)+'%'; el.style.animationDuration=(2.0+Math.random()*1.1)+'s'; road.appendChild(el);
      const hit=setInterval(()=>{
        if(!running||paused||!el.isConnected)return;
        const car=$('kidCar'); if(!car)return;
        const a=el.getBoundingClientRect(), b=car.getBoundingClientRect();
        const collide=!(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
        if(collide){
          clearInterval(hit); el.remove();
          if(el.dataset.correct==='1'){ score+=2; totalScore+=2; scoreText.textContent=score; sfxCorrect(); popText('Bagus! +2',b.left+b.width/2,b.top); }
          else { score=Math.max(0,score-1); scoreText.textContent=score; sfxWrong(); popText('Elak halangan!',b.left+b.width/2,b.top); }
        }
      },45);
      setTimeout(()=>{clearInterval(hit);el.remove()},3600);
    }
    function startGame(){
      if(!games.length){ showChoice(); return; }
      initAudio(); startOverlay.classList.remove('show'); rewardOverlay.classList.remove('show'); showGameNav(true); clearGame(); lastAlmost=false;
      const g=games[currentGame]; score=0; timeLeft=g.durationSeconds||60; running=true; paused=false; scoreText.textContent=0; timeText.textContent=timeLeft; timerPill.classList.remove('warning'); pauseBtn.textContent='⏸️ Pause'; levelTitle.textContent=g.title; instructionText.textContent=g.instructionText;
      startMusic(); speak(bank.audio.voice.welcomeText); setTimeout(()=>speak(g.instructionVoiceText),1900);
      clearInterval(encourageTimer); encourageTimer=setInterval(()=>{ if(running&&!paused&&timeLeft>12) speak(['Bagus adik.','Hebat.','Pandainya adik.','Teruskan.'][Math.floor(Math.random()*4)],1.0,1.22) },15000);
      if(g.mode==='trace'){ setupTraceGame(g); } else if(g.mode==='car'){ setupCarGame(g); } else { spawnTimer=setInterval(spawnItem,currentGame>=7?780:950); }
      countdownTimer=setInterval(()=>{if(!running||paused)return;timeLeft--;timeText.textContent=timeLeft;if(timeLeft<=10){timerPill.classList.add('warning');sfxTick();if(!lastAlmost){lastAlmost=true;speak(bank.audio.voice.almostFinishText)}}if(timeLeft<=0)endGame()},1000);
    }
    function clearGame(){gameArea.innerHTML='';clearInterval(spawnTimer);clearInterval(countdownTimer);traceCanvas=null;traceCtx=null;traceDrawing=false,carX=50,carMoveDir=0,carMoveTimer=null,carSpawnTimer=null;timerPill.classList.remove('warning');clearInterval(carMoveTimer);clearInterval(carSpawnTimer);carMoveDir=0}
    function endGame(){
      showGameNav(false);
      running=false;paused=false;clearGame();stopMusic();clearInterval(encourageTimer);sfxReward();speak(bank.audio.voice.rewardGoodText);
      const g=games[currentGame], r=g.reward||{passScore:4,twoStarsScore:8,threeStarsScore:14}; const stars=score>=r.threeStarsScore?3:score>=r.twoStarsScore?2:score>=r.passScore?1:0;
      rewardStars.textContent=stars===3?'⭐⭐⭐':stars===2?'⭐⭐☆':stars===1?'⭐☆☆':'🌟'; rewardTitle.textContent=currentGame===games.length-1?'👑 Tamat Semua!':'🎉 Syabas!'; rewardText.textContent=currentGame===games.length-1?`Hebat! Jumlah bintang awak: ${totalScore} ⭐`:`Awak dapat ${score} bintang. Jom sambung game seterusnya!`; buildMap(rewardLevelMap); nextBtn.textContent=currentGame===games.length-1?'🔁 Main Semula':'➡️ Game Seterusnya'; rewardOverlay.classList.add('show')
    }
    function nextGame(){ if(currentGame>=games.length-1){currentGame=0;totalScore=0}else currentGame++; speak(bank.audio.voice.nextGameText); setTimeout(startGame,450) }
    soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';if(!soundOn){stopMusic();speechSynthesis?.cancel()}else if(running)startMusic()});
    pauseBtn.addEventListener('click',()=>{if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶️ Sambung':'⏸️ Pause'});
    playGamesChoice.addEventListener('click',()=>selectMode('play'));
    traceLearnChoice.addEventListener('click',()=>selectMode('trace'));
    worksheetChoice.addEventListener('click',()=>selectMode('worksheet'));
    carChoice.addEventListener('click',()=>selectMode('car'));
    backChoiceBtn.addEventListener('click',showChoice);
    startBtn.addEventListener('click',()=>{ if(!selectedMode) showChoice(); else startGame(); });
    playNowBtn.addEventListener('click',()=>{ if(!games.length){ location.href='admin/control-panel.html'; return; } startGame(); });
    backCategoryBtn.addEventListener('click',backToCategory);
    homeMenuBtn.addEventListener('click',homeMenu);
    restartGameBtn.addEventListener('click',restartCurrentGame);
    nextBtn.addEventListener('click',nextGame);
    if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
    loadBank();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
